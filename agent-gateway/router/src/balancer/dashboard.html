<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BalanceAI · Load Distribution</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
    --good: #2ea44f; --bad: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg); padding: 24px;
  }
  h1 { margin: 0 0 4px 0; font-size: 28px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; }
  .hero {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px; margin-bottom: 24px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px;
  }
  .card h3 { margin: 0 0 6px 0; font-size: 12px; text-transform: uppercase;
             color: var(--muted); letter-spacing: 0.5px; font-weight: 600; }
  .big { font-size: 32px; font-weight: 700; }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .grid {
    display: grid; grid-template-columns: 2fr 1fr; gap: 16px;
  }
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: flex; align-items: center; gap: 12px; }
  .bar-label { width: 200px; font-family: ui-monospace, monospace; font-size: 13px; }
  .bar-track { flex: 1; background: #21262d; border-radius: 4px; height: 22px; overflow: hidden; position: relative; }
  .bar-fill { background: var(--accent); height: 100%; transition: width 0.3s ease; }
  .bar-fill.serving { background: var(--good); }
  .bar-fill.ejected { background: var(--bad); }
  .bar-fill.draining { background: var(--warn); }
  .bar-value { width: 80px; text-align: right; font-family: ui-monospace, monospace; font-size: 13px; }
  .status-pill {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px;
    font-weight: 600; text-transform: uppercase;
  }
  .status-pill.serving { background: #033a16; color: var(--good); }
  .status-pill.discovered, .status-pill.ready { background: #3a2d00; color: var(--warn); }
  .status-pill.ejected, .status-pill.terminated { background: #3a0d0d; color: var(--bad); }
  select, button {
    background: #21262d; border: 1px solid var(--border); color: var(--fg);
    padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  select:hover, button:hover { border-color: var(--accent); }
  .events {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; max-height: 400px; overflow-y: auto;
    font-family: ui-monospace, monospace; font-size: 12px;
  }
  .event { padding: 4px 0; border-bottom: 1px dotted var(--border); }
  .event:last-child { border-bottom: none; }
  .event .ts { color: var(--muted); margin-right: 8px; }
  .event .type { color: var(--accent); font-weight: 600; margin-right: 8px; }
  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  .donut {
    width: 140px; height: 140px; border-radius: 50%;
    background: conic-gradient(var(--good) 0% 100%);
    margin: 0 auto 8px;
  }
  .donut-label { text-align: center; font-size: 14px; color: var(--muted); }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>BalanceAI · Load Distribution</h1>
<div class="subtitle" id="subtitle">Loading pool snapshot…</div>

<div class="controls">
  <label for="agent-select">Agent:</label>
  <select id="agent-select"></select>
  <label for="strategy-select">Strategy:</label>
  <select id="strategy-select">
    <option value="round_robin">round_robin</option>
    <option value="random">random</option>
    <option value="least_connections">least_connections</option>
    <option value="p2c">p2c</option>
    <option value="chwbl">chwbl</option>
  </select>
  <button id="refresh-btn">Refresh</button>
</div>

<div class="hero">
  <div class="card"><h3>Total replicas</h3><div class="big" id="m-total">—</div></div>
  <div class="card"><h3>Healthy</h3><div class="big good" id="m-healthy">—</div></div>
  <div class="card"><h3>Active strategy</h3><div class="big" id="m-strategy">—</div></div>
  <div class="card"><h3>Fairness Gini</h3><div class="big" id="m-gini">—</div>
    <div class="subtitle" style="margin:0;font-size:11px">lower is better; &lt; 0.10 is balanced</div>
  </div>
</div>

<div class="grid">
  <div class="card">
    <h3 style="margin-bottom:12px">Inflight requests per replica</h3>
    <div class="bars" id="bars"></div>
  </div>
  <div class="card">
    <h3 style="margin-bottom:12px">Lifecycle events</h3>
    <div class="events" id="events"><div class="event">Waiting for events…</div></div>
  </div>
</div>

<script>
  const API = location.origin || "http://localhost:8081";
  const $ = (id) => document.getElementById(id);

  let currentAgent = null;
  let sse = null;

  async function loadPools() {
    try {
      const r = await fetch(`${API}/balancer/pools`);
      const data = await r.json();
      const names = data.pools.map(p => p.agent_name);
      const sel = $("agent-select");
      const prev = sel.value;
      sel.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join("");
      if (names.length === 0) {
        $("subtitle").textContent = "No agent pools registered. Scale an agent and refresh.";
        return null;
      }
      if (prev && names.includes(prev)) sel.value = prev;
      currentAgent = sel.value;
      return data;
    } catch (e) {
      $("subtitle").textContent = `Cannot reach balancer API (${e.message}). Is the router running on :8081?`;
      return null;
    }
  }

  async function loadPool(agent) {
    if (!agent) return;
    try {
      const r = await fetch(`${API}/balancer/pool/${agent}`);
      if (!r.ok) { $("subtitle").textContent = `Pool ${agent} not found`; return; }
      const data = await r.json();
      render(data);
    } catch (e) {
      $("subtitle").textContent = `Pool fetch failed: ${e.message}`;
    }
  }

  function render(pool) {
    $("subtitle").textContent = `Pool: ${pool.agent_name} · ${pool.replicas.length} replicas`;
    const serving = pool.replicas.filter(r => r.status === "serving").length;
    $("m-total").textContent = pool.replicas.length;
    $("m-healthy").textContent = `${serving} / ${pool.replicas.length}`;
    $("m-strategy").textContent = pool.strategy;
    $("strategy-select").value = pool.strategy;

    const counts = pool.replicas.map(r => r.inflight);
    $("m-gini").textContent = gini(counts).toFixed(3);

    const maxInflight = Math.max(1, ...counts);
    $("bars").innerHTML = pool.replicas.map(r => {
      const pct = (r.inflight / maxInflight) * 100;
      return `
        <div class="bar-row">
          <div class="bar-label">${r.container_name}
            <span class="status-pill ${r.status}">${r.status}</span></div>
          <div class="bar-track"><div class="bar-fill ${r.status}" style="width: ${pct}%"></div></div>
          <div class="bar-value">${r.inflight} inflight · ${(r.ewma_latency_ms || 0).toFixed(0)}ms</div>
        </div>
      `;
    }).join("");
  }

  function gini(values) {
    if (!values.length) return 0;
    const s = values.reduce((a, b) => a + b, 0);
    if (s === 0) return 0;
    let diffs = 0;
    for (const a of values) for (const b of values) diffs += Math.abs(a - b);
    return diffs / (2 * values.length * values.length * (s / values.length));
  }

  function startEventStream() {
    if (sse) sse.close();
    sse = new EventSource(`${API}/balancer/events`);
    sse.onmessage = (e) => {
      try {
        const ev = JSON.parse(e.data);
        const div = document.createElement("div");
        div.className = "event";
        div.innerHTML = `<span class="ts">${new Date().toLocaleTimeString()}</span>
                         <span class="type">${ev.type}</span>
                         ${ev.pool}/${ev.instance_id}`;
        const ec = $("events");
        if (ec.firstChild && ec.firstChild.textContent === "Waiting for events…") ec.innerHTML = "";
        ec.insertBefore(div, ec.firstChild);
        while (ec.children.length > 50) ec.removeChild(ec.lastChild);
        // Refresh pool on lifecycle change
        loadPool(currentAgent);
      } catch (_) {}
    };
    sse.onerror = () => { /* will reconnect automatically */ };
  }

  $("agent-select").addEventListener("change", (e) => {
    currentAgent = e.target.value;
    loadPool(currentAgent);
  });

  $("strategy-select").addEventListener("change", async (e) => {
    const strategy = e.target.value;
    await fetch(`${API}/balancer/strategy/${currentAgent}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ strategy }),
    });
    loadPool(currentAgent);
  });

  $("refresh-btn").addEventListener("click", () => loadPool(currentAgent));

  (async () => {
    await loadPools();
    if (currentAgent) {
      await loadPool(currentAgent);
      startEventStream();
      setInterval(() => loadPool(currentAgent), 2000);
    }
  })();
</script>
</body>
</html>

[pytest]
asyncio_mode = auto
testpaths = tests
# Coverage gate. Plan target is 90; we start at 75 because the AgentClient
# error/finally paths and the hedging system integration are not yet
# covered. Raise as those tests land. The gate is conditional on
# pytest-cov being installed (skipped silently if not) so a contributor
# without dev deps can still run unit tests.
addopts = --cov=router.src.balancer --cov-report=term-missing --cov-fail-under=75

[pytest]
asyncio_mode = auto
testpaths = tests
# Coverage gate. Plan target is 90 and pytest-cov is a required dev
# dependency (see pyproject.toml). A contributor without dev deps will
# get an ImportError before this kicks in, which is the right failure
# mode: the gate is supposed to be enforceable, not silently skipped.
addopts = --cov=router.src.balancer --cov-report=term-missing --cov-fail-under=90
